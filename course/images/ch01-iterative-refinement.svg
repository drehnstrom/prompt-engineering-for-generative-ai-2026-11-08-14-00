<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Iterative refinement loop showing prompt, model output, evaluation, and refinement">
  <defs>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.5" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>
  <!-- Node 1: Prompt -->
  <g transform="translate(20, 80)">
    <rect width="110" height="60" rx="8" fill="#082445"/>
    <text x="55" y="35" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Prompt</text>
  </g>
  <!-- Arrow 1 -->
  <path d="M 135 110 L 175 110" stroke="#1e71d6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <!-- Node 2: Model Output -->
  <g transform="translate(180, 80)">
    <rect width="110" height="60" rx="8" fill="#1e71d6"/>
    <text x="55" y="35" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Output</text>
  </g>
  <!-- Arrow 2 -->
  <path d="M 295 110 L 335 110" stroke="#6a55e4" stroke-width="3" fill="none"/>
  <!-- Node 3: Evaluate -->
  <g transform="translate(340, 80)">
    <rect width="110" height="60" rx="8" fill="#6a55e4"/>
    <text x="55" y="35" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Evaluate</text>
  </g>
  <!-- Arrow 3 (Feedback loop back) -->
  <path d="M 395 80 C 395 30, 135 30, 135 80" stroke="url(#loopGrad)" stroke-width="3" fill="none" stroke-dasharray="6,4"/>
  <text x="265" y="22" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">Refine &amp; Adjust</text>
</svg>
